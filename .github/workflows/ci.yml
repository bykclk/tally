name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # `npm run lint` is intentionally not gated in CI yet: the codebase still
      # has pre-existing eslint findings to clean up first. Re-add a lint step
      # once `npm run lint` is green.
